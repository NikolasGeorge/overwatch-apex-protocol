name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # pip caching looks only for requirements.txt or pyproject.toml by
          # default, and this repo has neither -- the script is stdlib-only,
          # so the sole dependency file is a dev one.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q extract_hud.py

  docs-are-current:
    # extract_hud.py generates docs/. If a commit changes the game source or
    # the generator without regenerating, the published docs silently drift
    # from what the mode actually does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regenerate and diff
        run: |
          python extract_hud.py
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date -- run 'python extract_hud.py' and commit the result"
            exit 1
          }
